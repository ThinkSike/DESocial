services:
  postgres:
    image: postgres:16-alpine
    container_name: desocial-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    env_file: .env.local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: desocial-minio
    restart: unless-stopped
    ports:
      - "9002:9000"
      - "9003:9001"
    env_file: .env.local
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    container_name: desocial-minio-init
    depends_on:
      - minio
    env_file: .env.local
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set desocial http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}) do sleep 1; done;
      /usr/bin/mc mb desocial/${S3_BUCKET} --ignore-existing;
      /usr/bin/mc anonymous set download desocial/${S3_BUCKET};
      echo 'MinIO bucket ready';
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
